<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Poker Pro</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#050807;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

.app{
    width:100%;
    max-width:900px;
    margin:auto;
    min-height:100vh;
    padding:10px;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 4px 12px;
}

.logo{
    font-size:20px;
    font-weight:900;
    letter-spacing:1px;
}

.connection{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12px;
    color:#aaa;
}

.dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#777;
}

.dot.online{
    background:#20d878;
    box-shadow:0 0 10px #20d878;
}

.dot.error{
    background:#ff3b30;
}

/* TABLE */

.table{
    position:relative;
    width:100%;
    aspect-ratio:1.45 / 1;
    min-height:470px;
    max-height:650px;

    border-radius:50%;

    background:
        radial-gradient(
            ellipse at center,
            #147844 0%,
            #0b572f 55%,
            #06351f 100%
        );

    border:14px solid #171717;

    box-shadow:
        0 0 0 3px #323232,
        inset 0 0 40px rgba(0,0,0,.6),
        0 15px 50px rgba(0,0,0,.7);

    margin:5px auto 15px;
}

/* FELT */

.table:after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.08),
        inset 0 0 60px rgba(0,0,0,.35);
    pointer-events:none;
}

/* CENTER */

.center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:72%;
    text-align:center;
    z-index:5;
}

.pot{
    font-size:13px;
    color:#c8e8d4;
    margin-bottom:8px;
}

.pot strong{
    color:#fff;
    font-size:20px;
}

.stage{
    display:inline-block;
    padding:5px 12px;
    border-radius:20px;
    background:rgba(0,0,0,.35);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:12px;
}

.community{
    display:flex;
    justify-content:center;
    gap:6px;
    min-height:66px;
}

/* CARDS */

.card{
    width:44px;
    height:62px;
    border-radius:6px;
    background:#fff;
    color:#111;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:18px;
    font-weight:900;

    box-shadow:
        0 4px 8px rgba(0,0,0,.4);

    animation:cardIn .25s ease;
}

.card.red{
    color:#d92727;
}

.card.back{
    background:
        linear-gradient(135deg,#8b1515,#4b0808);
    color:white;
    border:2px solid #d7a74b;
}

@keyframes cardIn{
    from{
        transform:translateY(-15px) scale(.8);
        opacity:0;
    }
    to{
        transform:translateY(0) scale(1);
        opacity:1;
    }
}

/* PLAYERS */

.seat{
    position:absolute;
    width:92px;
    text-align:center;
    z-index:10;
}

.seatBox{
    position:relative;
    padding:6px 5px;
    border-radius:12px;

    background:rgba(0,0,0,.7);
    border:1px solid rgba(255,255,255,.12);

    box-shadow:0 4px 12px rgba(0,0,0,.4);
}

.avatar{
    width:34px;
    height:34px;
    margin:-24px auto 3px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#222;
    border:2px solid #aaa;

    font-size:17px;
}

.name{
    font-size:11px;
    font-weight:bold;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chips{
    font-size:10px;
    color:#d9d9d9;
    margin-top:3px;
}

.playerStatus{
    font-size:9px;
    color:#ffcf55;
    margin-top:2px;
}

.dealer{
    position:absolute;
    top:-8px;
    right:-8px;

    width:21px;
    height:21px;

    background:#fff;
    color:#111;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:10px;
    font-weight:bold;
}

/* ACTIVE PLAYER */

.seat.active .seatBox{
    border-color:#ffd447;
    box-shadow:
        0 0 0 2px rgba(255,212,71,.25),
        0 0 18px rgba(255,212,71,.5);
}

.seat.folded{
    opacity:.35;
}

/* TIMER */

.timer{
    position:absolute;
    left:50%;
    bottom:-13px;

    transform:translateX(-50%);

    width:28px;
    height:28px;

    border-radius:50%;

    background:#111;
    border:2px solid #22d878;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:10px;
    font-weight:bold;
}

.timer.warning{
    border-color:#ffc107;
    color:#ffc107;
}

.timer.danger{
    border-color:#ff3b30;
    color:#ff3b30;
}

/* SEAT POSITIONS */

.s0{
    left:50%;
    top:-25px;
    transform:translateX(-50%);
}

.s1{
    right:0;
    top:18%;
}

.s2{
    right:0;
    bottom:18%;
}

.s3{
    left:50%;
    bottom:-25px;
    transform:translateX(-50%);
}

.s4{
    left:0;
    bottom:18%;
}

.s5{
    left:0;
    top:18%;
}

/* MY CARDS */

.myCards{
    margin:8px 0 12px;
    text-align:center;
}

.myTitle{
    font-size:12px;
    color:#aaa;
    margin-bottom:7px;
}

.hand{
    display:flex;
    justify-content:center;
    gap:8px;
}

.myCard{
    width:65px;
    height:88px;

    border-radius:8px;

    background:white;
    color:#111;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:25px;
    font-weight:900;

    box-shadow:
        0 5px 15px rgba(0,0,0,.5);

    animation:cardIn .3s ease;
}

.myCard.red{
    color:#d92727;
}

/* MESSAGE */

.message{
    min-height:25px;
    text-align:center;
    font-size:13px;
    color:#ddd;
    margin:5px 0;
}

.winner{
    color:#ffd447;
    font-weight:bold;
}

/* ACTIONS */

.actions{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-top:10px;
}

button{
    border:0;
    border-radius:10px;
    min-height:44px;

    background:#1b2420;
    color:white;

    font-size:12px;
    font-weight:bold;

    cursor:pointer;

    transition:.15s;
}

button:active{
    transform:scale(.96);
}

button:disabled{
    opacity:.35;
}

.fold{
    background:#701d1d;
}

.call{
    background:#145f3a;
}

.raise{
    background:#73530d;
}

.allin{
    background:#7a1e68;
}

.secondary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:7px;
}

.secondary button{
    background:#151a18;
    color:#aaa;
    min-height:38px;
}

/* RAISE PANEL */

.raisePanel{
    display:none;
    margin-top:7px;

    padding:8px;

    background:#111715;
    border-radius:10px;

    gap:7px;
}

.raisePanel.show{
    display:flex;
}

.raisePanel input{
    flex:1;
    min-width:0;

    border:1px solid #333;
    border-radius:8px;

    background:#080a09;
    color:white;

    padding:10px;
    outline:none;
}

.raisePanel button{
    width:90px;
}

/* INFO */

.info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-top:10px;
}

.infoBox{
    background:#0d1210;
    border:1px solid #202723;
    border-radius:9px;

    text-align:center;
    padding:8px 4px;
}

.infoLabel{
    font-size:9px;
    color:#777;
}

.infoValue{
    font-size:12px;
    margin-top:3px;
}

/* START */

.startArea{
    margin-top:10px;
}

.start{
    width:100%;
    background:#d4a72c;
    color:#111;
    font-size:14px;
    min-height:48px;
}

/* RESPONSIVE */

@media(max-width:520px){

    .table{
        min-height:420px;
        border-width:10px;
    }

    .seat{
        width:82px;
    }

    .card{
        width:39px;
        height:57px;
        font-size:16px;
    }

    .myCard{
        width:58px;
        height:80px;
        font-size:22px;
    }

    .center{
        width:78%;
    }

    .community{
        gap:4px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">

        <div class="logo">
            ♠ POKER PRO
        </div>

        <div class="connection">
            <span id="connectionDot" class="dot"></span>
            <span id="connectionText">Connecting...</span>
        </div>

    </div>

    <div class="table">

        <!-- CENTER -->

        <div class="center">

            <div class="pot">
                POT:
                <strong id="pot">0</strong>
            </div>

            <div id="stage" class="stage">
                WAITING
            </div>

            <div id="community" class="community"></div>

        </div>

        <!-- SEATS -->

        <div id="seat0" class="seat s0"></div>
        <div id="seat1" class="seat s1"></div>
        <div id="seat2" class="seat s2"></div>
        <div id="seat3" class="seat s3"></div>
        <div id="seat4" class="seat s4"></div>
        <div id="seat5" class="seat s5"></div>

    </div>

    <!-- MY CARDS -->

    <div class="myCards">

        <div class="myTitle">
            YOUR CARDS
        </div>

        <div id="myCards" class="hand"></div>

    </div>

    <!-- MESSAGE -->

    <div id="message" class="message">
        Connecting to poker table...
    </div>

    <!-- ACTIONS -->

    <div class="actions">

        <button
            id="foldBtn"
            class="fold"
            onclick="sendAction('fold')">
            FOLD
        </button>

        <button
            id="checkBtn"
            onclick="sendAction('check')">
            CHECK
        </button>

        <button
            id="callBtn"
            class="call"
            onclick="sendAction('call')">
            CALL
        </button>

        <button
            id="allinBtn"
            class="allin"
            onclick="sendAction('allin')">
            ALL-IN
        </button>

    </div>

    <div class="raisePanel" id="raisePanel">

        <input
            id="raiseAmount"
            type="number"
            min="20"
            step="10"
            placeholder="Raise amount">

        <button
            class="raise"
            onclick="sendRaise()">
            RAISE
        </button>

    </div>

    <div class="secondary">

        <button onclick="toggleRaise()">
            RAISE
        </button>

        <button onclick="refreshNow()">
            REFRESH
        </button>

    </div>

    <!-- INFO -->

    <div class="info">

        <div class="infoBox">

            <div class="infoLabel">
                STAGE
            </div>

            <div
                id="infoStage"
                class="infoValue">
                Waiting
            </div>

        </div>

        <div class="infoBox">

            <div class="infoLabel">
                CURRENT BET
            </div>

            <div
                id="currentBet"
                class="infoValue">
                0
            </div>

        </div>

        <div class="infoBox">

            <div class="infoLabel">
                PLAYERS
            </div>

            <div
                id="playerCount"
                class="infoValue">
                0 / 6
            </div>

        </div>

    </div>

    <!-- START -->

    <div class="startArea">

        <button
            id="startBtn"
            class="start"
            onclick="startGame()">
            START GAME
        </button>

    </div>

</div>

<script>

const tg = window.Telegram?.WebApp;

if(tg){

    tg.ready();
    tg.expand();

}

const API =
    "https://telegram-poker-pro-backend.onrender.com";

let myUserId = null;
let myName = "Player";

let gameData = null;
let myCards = [];

let loading = false;

let localTimer = 0;

let lastHandNumber = 0;


/* =====================================================
   TELEGRAM USER
===================================================== */

function getTelegramUser(){

    try{

        const user =
            tg?.initDataUnsafe?.user;

        if(user){

            myUserId =
                String(user.id);

            myName =
                user.first_name ||
                user.username ||
                "Player";

            return;
        }

    }catch(e){}

    let saved =
        localStorage.getItem(
            "poker_user_id"
        );

    if(!saved){

        saved =
            "web_" +
            Date.now() +
            "_" +
            Math.floor(
                Math.random()*10000
            );

        localStorage.setItem(
            "poker_user_id",
            saved
        );

    }

    myUserId = saved;

    myName =
        localStorage.getItem(
            "poker_name"
        ) ||
        "Player";

}


/* =====================================================
   CONNECTION UI
===================================================== */

function setConnection(
    online,
    text
){

    const dot =
        document.getElementById(
            "connectionDot"
        );

    const label =
        document.getElementById(
            "connectionText"
        );

    dot.className =
        "dot " +
        (
            online
            ? "online"
            : "error"
        );

    label.textContent = text;

}


/* =====================================================
   API
===================================================== */

async function api(
    path,
    options={}
){

    const response =
        await fetch(
            API + path,
            {
                ...options,
                headers:{
                    "Content-Type":
                        "application/json",
                    ...(options.headers || {})
                }
            }
        );

    if(!response.ok){

        throw new Error(
            "HTTP " +
            response.status
        );

    }

    return await response.json();

}


/* =====================================================
   JOIN
===================================================== */

async function joinGame(){

    try{

        const result =
            await api(
                "/join",
                {
                    method:"POST",
                    body:JSON.stringify({
                        user_id:myUserId,
                        name:myName
                    })
                }
            );

        if(!result.success){

            showMessage(
                result.message ||
                "Unable to join table"
            );

            return false;
        }

        setConnection(
            true,
            "Connected"
        );

        return true;

    }catch(error){

        console.error(error);

        setConnection(
            false,
            "Connection failed"
        );

        showMessage(
            "Cannot connect to poker server"
        );

        return false;
    }

}


/* =====================================================
   LOAD GAME
===================================================== */

async function loadGame(){

    try{

        const data =
            await api(
                "/game"
            );

        if(!data.success){

            return;
        }

        gameData = data;

        renderGame(data);

        setConnection(
            true,
            "Connected"
        );

    }catch(error){

        console.error(error);

        setConnection(
            false,
            "Offline"
        );

    }

}


/* =====================================================
   LOAD CARDS
===================================================== */

async function loadMyCards(){

    if(!myUserId)
        return;

    try{

        const data =
            await api(
                "/my-cards?user_id=" +
                encodeURIComponent(
                    myUserId
                )
            );

        if(data.success){

            myCards =
                data.cards || [];

            renderMyCards();

        }

    }catch(error){

        console.error(error);

    }

}


/* =====================================================
   RENDER GAME
===================================================== */

function renderGame(data){

    document.getElementById(
        "pot"
    ).textContent =
        data.pot ?? 0;

    document.getElementById(
        "stage"
    ).textContent =
        String(
            data.stage || "waiting"
        ).toUpperCase();

    document.getElementById(
        "infoStage"
    ).textContent =
        data.stage || "waiting";

    document.getElementById(
        "currentBet"
    ).textContent =
        data.current_bet ?? 0;

    document.getElementById(
        "playerCount"
    ).textContent =
        `${data.players?.length || 0} / 6`;

    renderCommunity(
        data.community_cards || []
    );

    renderPlayers(
        data.players || [],
        data.current_player,
        data.turn_time
    );

    updateActions(
        data
    );

    if(data.message){

        if(data.winner){

            showMessage(
                "🏆 " +
                data.message,
                true
            );

        }else{

            showMessage(
                data.message
            );

        }

    }else if(!data.started){

        showMessage(
            "Waiting for next hand..."
        );

    }

    if(
        data.hand_number &&
        data.hand_number !== lastHandNumber
    ){

        lastHandNumber =
            data.hand_number;

        myCards = [];

    }

}


/* =====================================================
   COMMUNITY CARDS
===================================================== */

function renderCommunity(cards){

    const container =
        document.getElementById(
            "community"
        );

    container.innerHTML = "";

    cards.forEach(card => {

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "card " +
            (
                isRed(card)
                ? "red"
                : ""
            );

        div.textContent = card;

        container.appendChild(
            div
        );

    });

}


/* =====================================================
   MY CARDS
===================================================== */

function renderMyCards(){

    const container =
        document.getElementById(
            "myCards"
        );

    container.innerHTML = "";

    myCards.forEach(card => {

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "myCard " +
            (
                isRed(card)
                ? "red"
                : ""
            );

        div.textContent = card;

        container.appendChild(
            div
        );

    });

}


/* =====================================================
   PLAYER SEATS
===================================================== */

function renderPlayers(
    list,
    currentPlayer,
    serverTime
){

    for(let i=0;i<6;i++){

        const seat =
            document.getElementById(
                "seat" + i
            );

        seat.innerHTML = "";

        seat.className =
            "seat " +
            [
                "s0",
                "s1",
                "s2",
                "s3",
                "s4",
                "s5"
            ][i];

        const p =
            list[i];

        if(!p)
            continue;

        if(p.folded){

            seat.classList.add(
                "folded"
            );

        }

        if(
            p.user_id ===
            currentPlayer
        ){

            seat.classList.add(
                "active"
            );

        }

        const box =
            document.createElement(
                "div"
            );

        box.className =
            "seatBox";

        const avatar =
            document.createElement(
                "div"
            );

        avatar.className =
            "avatar";

        avatar.textContent =
            p.is_bot
            ? "🤖"
            : "👤";

        box.appendChild(
            avatar
        );

        if(p.is_dealer){

            const dealer =
                document.createElement(
                    "div"
                );

            dealer.className =
                "dealer";

            dealer.textContent =
                "D";

            box.appendChild(
                dealer
            );

        }

        const name =
            document.createElement(
                "div"
            );

        name.className =
            "name";

        name.textContent =
            p.name || "Player";

        box.appendChild(
            name
        );

        const chips =
            document.createElement(
                "div"
            );

        chips.className =
            "chips";

        chips.textContent =
            "🪙 " +
            (p.chips ?? 0);

        box.appendChild(
            chips
        );

        const status =
            document.createElement(
                "div"
            );

        status.className =
            "playerStatus";

        if(p.folded){

            status.textContent =
                "FOLDED";

        }else if(p.all_in){

            status.textContent =
                "ALL-IN";

        }else if(
            p.user_id ===
            currentPlayer
        ){

            status.textContent =
                "YOUR TURN";

        }else{

            status.textContent =
                "";
        }

        box.appendChild(
            status
        );

        seat.appendChild(
            box
        );

        if(
            p.user_id ===
            currentPlayer
        ){

            const timer =
                document.createElement(
                    "div"
                );

            timer.className =
                "timer";

            timer.id =
                "seatTimer";

            timer.textContent =
                serverTime ?? 0;

            seat.appendChild(
                timer
            );

        }

    }

    localTimer =
        Number(
            serverTime || 0
        );

}


/* =====================================================
   TIMER
===================================================== */

function updateLocalTimer(){

    if(
        !gameData ||
        !gameData.started
    ){

        return;
    }

    const timer =
        document.getElementById(
            "seatTimer"
        );

    if(!timer)
        return;

    localTimer =
        Math.max(
            0,
            localTimer - 1
        );

    timer.textContent =
        localTimer;

    timer.classList.remove(
        "warning",
        "danger"
    );

    if(localTimer <= 10){

        timer.classList.add(
            "warning"
        );

    }

    if(localTimer <= 5){

        timer.classList.add(
            "danger"
        );

    }

}


/* =====================================================
   ACTION BUTTONS
===================================================== */

function updateActions(data){

    const myTurn =
        data.current_player ===
        myUserId;

    const active =
        data.started &&
        myTurn;

    document.getElementById(
        "foldBtn"
    ).disabled =
        !active;

    document.getElementById(
        "checkBtn"
    ).disabled =
        !active;

    document.getElementById(
        "callBtn"
    ).disabled =
        !active;

    document.getElementById(
        "allinBtn"
    ).disabled =
        !active;

}


/* =====================================================
   SEND ACTION
===================================================== */

async function sendAction(
    action
){

    if(loading)
        return;

    if(
        !gameData ||
        gameData.current_player !==
        myUserId
    ){

        showMessage(
            "It is not your turn"
        );

        return;
    }

    loading = true;

    try{

        const result =
            await api(
                "/action",
                {
                    method:"POST",
                    body:JSON.stringify({
                        user_id:myUserId,
                        action:action,
                        amount:0
                    })
                }
            );

        if(!result.success){

            showMessage(
                result.message ||
                "Action failed"
            );

        }

        await refreshNow();

    }catch(error){

        console.error(error);

        showMessage(
            "Action failed"
        );

    }

    loading = false;

}


/* =====================================================
   RAISE
===================================================== */

function toggleRaise(){

    const panel =
        document.getElementById(
            "raisePanel"
        );

    panel.classList.toggle(
        "show"
    );

}


async function sendRaise(){

    const input =
        document.getElementById(
            "raiseAmount"
        );

    const amount =
        Number(
            input.value
        );

    if(!amount){

        showMessage(
            "Enter raise amount"
        );

        return;
    }

    if(loading)
        return;

    loading = true;

    try{

        const result =
            await api(
                "/action",
                {
                    method:"POST",
                    body:JSON.stringify({
                        user_id:myUserId,
                        action:"raise",
                        amount:amount
                    })
                }
            );

        if(!result.success){

            showMessage(
                result.message ||
                "Raise failed"
            );

        }

        input.value = "";

        document.getElementById(
            "raisePanel"
        ).classList.remove(
            "show"
        );

        await refreshNow();

    }catch(error){

        console.error(error);

        showMessage(
            "Raise failed"
        );

    }

    loading = false;

}


/* =====================================================
   START GAME
===================================================== */

async function startGame(){

    if(loading)
        return;

    loading = true;

    try{

        const result =
            await api(
                "/start",
                {
                    method:"POST"
                }
            );

        if(!result.success){

            showMessage(
                result.message ||
                "Could not start game"
            );

        }else{

            showMessage(
                "Game started"
            );

        }

        await refreshNow();

    }catch(error){

        console.error(error);

        showMessage(
            "Could not start game"
        );

    }

    loading = false;

}


/* =====================================================
   REFRESH
===================================================== */

async function refreshNow(){

    await loadGame();
    await loadMyCards();

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    winner=false
){

    const el =
        document.getElementById(
            "message"
        );

    el.textContent =
        text;

    el.className =
        winner
        ? "message winner"
        : "message";

}


/* =====================================================
   RED CARD
===================================================== */

function isRed(card){

    if(!card)
        return false;

    return (
        card.includes("♥") ||
        card.includes("♦")
    );

}


/* =====================================================
   INITIALIZE
===================================================== */

async function initialize(){

    getTelegramUser();

    const joined =
        await joinGame();

    if(!joined)
        return;

    await refreshNow();

    setInterval(
        loadGame,
        1000
    );

    setInterval(
        loadMyCards,
        1200
    );

    setInterval(
        updateLocalTimer,
        1000
    );

}


/* =====================================================
   START
===================================================== */

initialize();
