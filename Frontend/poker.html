<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Poker Pro</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #163d2b 0%, #07110d 60%);
    color: white;
}

body {
    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 700px;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

/* =========================
   TOP BAR
========================= */

.topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 62px;
    z-index: 20;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 10px 14px;

    background: rgba(0,0,0,.35);
    backdrop-filter: blur(10px);
}

.logo {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 1px;
}

.balance {
    background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 20px;
    padding: 8px 13px;
    font-size: 13px;
}

.balance span {
    color: #ffd54a;
    font-weight: bold;
}

/* =========================
   CONNECTION
========================= */

.connection {
    position: absolute;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;

    padding: 5px 12px;
    border-radius: 20px;

    background: rgba(0,0,0,.55);

    font-size: 11px;
    color: #7dff9b;

    white-space: nowrap;
}

/* =========================
   TABLE AREA
========================= */

.table-area {
    position: absolute;
    top: 62px;
    left: 0;
    right: 0;
    bottom: 155px;
}

/* =========================
   POKER TABLE
========================= */

.table {
    position: absolute;

    width: 88%;
    height: 55%;

    left: 6%;
    top: 22%;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at center,
            #17613e 0%,
            #0d492f 55%,
            #083723 100%
        );

    border: 9px solid #4d2b15;

    box-shadow:
        0 0 0 3px #b88745,
        0 20px 50px rgba(0,0,0,.7),
        inset 0 0 40px rgba(0,0,0,.45);

}

/* =========================
   POT
========================= */

.pot {
    position: absolute;
    top: 17%;
    left: 50%;
    transform: translateX(-50%);

    text-align: center;

    z-index: 5;
}

.pot-label {
    font-size: 11px;
    opacity: .7;
    text-transform: uppercase;
}

.pot-value {
    margin-top: 3px;

    font-size: 24px;
    font-weight: 900;

    color: #ffd54a;

    text-shadow:
        0 2px 5px rgba(0,0,0,.6);
}

/* =========================
   STAGE
========================= */

.stage {
    position: absolute;

    top: 9%;
    left: 50%;
    transform: translateX(-50%);

    padding: 5px 12px;

    border-radius: 15px;

    background: rgba(0,0,0,.4);

    font-size: 11px;
    text-transform: uppercase;

    letter-spacing: 1px;
}

/* =========================
   COMMUNITY CARDS
========================= */

.community {
    position: absolute;

    top: 42%;
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    gap: 5px;

    min-height: 62px;

    justify-content: center;
}

.card {
    width: 43px;
    height: 60px;

    border-radius: 7px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #dedede
        );

    color: #111;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 19px;
    font-weight: 900;

    box-shadow:
        0 3px 8px rgba(0,0,0,.45);

    animation: cardIn .25s ease;
}

.card.red {
    color: #d92727;
}

.card.empty {
    background:
        rgba(255,255,255,.06);

    border:
        1px dashed rgba(255,255,255,.15);

    color: transparent;
    box-shadow: none;
}

@keyframes cardIn {

    from {
        transform: translateY(-15px) scale(.8);
        opacity: 0;
    }

    to {
        transform: translateY(0) scale(1);
        opacity: 1;
    }

}

/* =========================
   SEATS
========================= */

.seat {
    position: absolute;

    width: 92px;

    transform: translate(-50%, -50%);

    text-align: center;

    z-index: 10;
}

.seat-avatar {
    position: relative;

    width: 45px;
    height: 45px;

    margin: auto;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            145deg,
            #303030,
            #111
        );

    border: 2px solid rgba(255,255,255,.3);

    font-size: 21px;

    box-shadow:
        0 4px 12px rgba(0,0,0,.5);

}

.seat.active .seat-avatar {

    border-color: #39ff79;

    box-shadow:
        0 0 0 3px rgba(57,255,121,.15),
        0 0 18px rgba(57,255,121,.8);

    animation: activePulse 1s infinite;
}

@keyframes activePulse {

    50% {
        box-shadow:
            0 0 0 6px rgba(57,255,121,.08),
            0 0 25px rgba(57,255,121,.95);
    }

}

.seat-name {

    margin-top: 4px;

    font-size: 11px;
    font-weight: bold;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.seat-chips {

    margin-top: 2px;

    font-size: 10px;

    color: #ffd54a;
}

.seat-bet {

    margin-top: 2px;

    font-size: 9px;

    color: #b8ffca;
}

/* =========================
   TIMER
========================= */

.timer {

    position: absolute;

    width: 39px;
    height: 39px;

    top: -7px;
    left: 50%;

    transform: translateX(-50%);

    border-radius: 50%;

    background:
        conic-gradient(
            #39ff79 var(--progress),
            rgba(255,255,255,.12) var(--progress)
        );

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: -1;

    opacity: 0;

}

.timer::after {

    content: "";

    width: 31px;
    height: 31px;

    border-radius: 50%;

    background: #111;

    position: absolute;
}

.timer-text {

    position: relative;
    z-index: 2;

    font-size: 11px;
    font-weight: 900;
}

.seat.active .timer {
    opacity: 1;
}

.seat.warning .timer {

    background:
        conic-gradient(
            #ffb020 var(--progress),
            rgba(255,255,255,.12) var(--progress)
        );
}

.seat.danger .timer {

    background:
        conic-gradient(
            #ff3030 var(--progress),
            rgba(255,255,255,.12) var(--progress)
        );

    animation: dangerPulse .5s infinite;
}

@keyframes dangerPulse {

    50% {
        transform:
            translateX(-50%)
            scale(1.08);
    }

}

/* =========================
   DEALER
========================= */

.dealer {

    position: absolute;

    width: 19px;
    height: 19px;

    border-radius: 50%;

    background: white;
    color: #111;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 9px;
    font-weight: bold;

    border: 1px solid #aaa;

    right: -4px;
    bottom: 2px;

    box-shadow:
        0 2px 5px rgba(0,0,0,.5);
}

/* =========================
   YOUR CARDS
========================= */

.my-cards {

    position: absolute;

    bottom: 8px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 15;

    text-align: center;
}

.my-label {

    font-size: 10px;
    opacity: .7;

    margin-bottom: 5px;
}

.my-card-row {

    display: flex;
    justify-content: center;

    gap: 7px;
}

.my-card {

    width: 53px;
    height: 74px;

    border-radius: 8px;

    background:
        linear-gradient(
            135deg,
            #fff,
            #ddd
        );

    color: #111;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 23px;
    font-weight: 900;

    box-shadow:
        0 5px 14px rgba(0,0,0,.55);

    animation: myCard .3s ease;
}

@keyframes myCard {

    from {
        transform: translateY(25px) rotate(-5deg);
        opacity: 0;
    }

    to {
        transform: translateY(0) rotate(0);
        opacity: 1;
    }

}

/* =========================
   CONTROLS
========================= */

.controls {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 155px;

    padding:
        8px 12px
        calc(8px + env(safe-area-inset-bottom));

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.96),
            rgba(0,0,0,.82)
        );

    z-index: 50;
}

.turn-info {

    height: 24px;

    text-align: center;

    font-size: 12px;

    color: #8effa8;
}

.buttons {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 7px;

    margin-top: 5px;
}

button {

    border: none;

    border-radius: 9px;

    min-height: 42px;

    font-weight: 900;

    font-size: 12px;

    color: white;

    cursor: pointer;

    transition: .15s;
}

button:active {
    transform: scale(.96);
}

.fold {
    background: #8e2525;
}

.check {
    background: #176c43;
}

.call {
    background: #176c70;
}

.raise {
    background: #76511c;
}

.allin {
    background: #76205f;
}

.secondary {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 7px;

    margin-top: 7px;
}

.secondary button {

    min-height: 34px;

    background:
        rgba(255,255,255,.09);

    border:
        1px solid rgba(255,255,255,.12);
}

/* =========================
   RAISE BOX
========================= */

.raise-box {

    position: fixed;

    left: 50%;
    bottom: 160px;

    transform:
        translateX(-50%)
        translateY(20px);

    width: min(90%, 330px);

    padding: 14px;

    border-radius: 15px;

    background:
        rgba(15,15,15,.96);

    border:
        1px solid rgba(255,255,255,.12);

    box-shadow:
        0 15px 50px rgba(0,0,0,.7);

    z-index: 100;

    display: none;
}

.raise-box.show {

    display: block;

    animation:
        raiseIn .2s ease;
}

@keyframes raiseIn {

    from {
        opacity: 0;
        transform:
            translateX(-50%)
            translateY(20px);
    }

    to {
        opacity: 1;
        transform:
            translateX(-50%)
            translateY(0);
    }

}

.raise-title {

    text-align: center;

    font-weight: bold;

    margin-bottom: 10px;
}

.raise-input {

    width: 100%;

    height: 40px;

    border-radius: 8px;

    border:
        1px solid rgba(255,255,255,.15);

    background: #111;

    color: white;

    padding: 0 10px;

    font-size: 15px;
}

.raise-actions {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 7px;

    margin-top: 8px;
}

/* =========================
   MESSAGE
========================= */

.message {

    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    z-index: 200;

    padding: 15px 22px;

    border-radius: 15px;

    background:
        rgba(0,0,0,.9);

    border:
        1px solid rgba(255,255,255,.15);

    text-align: center;

    font-weight: bold;

    display: none;

    box-shadow:
        0 15px 50px rgba(0,0,0,.7);
}

.message.show {
    display: block;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-height: 650px) {

    .table {
        height: 53%;
        top: 21%;
    }

    .table-area {
        bottom: 145px;
    }

    .controls {
        height: 145px;
    }

    .my-card {
        width: 47px;
        height: 66px;
    }

}

</style>
</head>

<body>

<div class="app">

    <div class="topbar">

        <div class="logo">
            ♠ POKER PRO
        </div>

        <div class="balance">
            🪙 <span id="balance">1,000</span>
        </div>

    </div>

    <div
        id="connection"
        class="connection">
        Connecting...
    </div>

    <div class="table-area">

        <div class="table">

            <div class="stage"
                 id="stage">
                WAITING
            </div>

            <div class="pot">

                <div class="pot-label">
                    POT
                </div>

                <div
                    class="pot-value"
                    id="pot">
                    0
                </div>

            </div>

            <div
                class="community"
                id="community">
            </div>

            <!-- SEATS -->

            <div class="seat"
                 id="seat0"
                 style="left:50%;top:91%;">
                <div class="seat-avatar">♠</div>
                <div class="seat-name">Empty</div>
                <div class="seat-chips">-</div>
                <div class="seat-bet"></div>
            </div>

            <div class="seat"
                 id="seat1"
                 style="left:13%;top:70%;">
                <div class="seat-avatar">♠</div>
                <div class="seat-name">Empty</div>
                <div class="seat-chips">-</div>
                <div class="seat-bet"></div>
            </div>

            <div class="seat"
                 id="seat2"
                 style="left:12%;top:25%;">
                <div class="seat-avatar">♠</div>
                <div class="seat-name">Empty</div>
                <div class="seat-chips">-</div>
                <div class="seat-bet"></div>
            </div>

            <div class="seat"
                 id="seat3"
                 style="left:50%;top:7%;">
                <div class="seat-avatar">♠</div>
                <div class="seat-name">Empty</div>
                <div class="seat-chips">-</div>
                <div class="seat-bet"></div>
            </div>

            <div class="seat"
                 id="seat4"
                 style="left:88%;top:25%;">
                <div class="seat-avatar">♠</div>
                <div class="seat-name">Empty</div>
                <div class="seat-chips">-</div>
                <div class="seat-bet"></div>
            </div>

            <div class="seat"
                 id="seat5"
                 style="left:87%;top:70%;">
                <div class="seat-avatar">♠</div>
                <div class="seat-name">Empty</div>
                <div class="seat-chips">-</div>
                <div class="seat-bet"></div>
            </div>

        </div>

        <div class="my-cards">

            <div class="my-label">
                YOUR CARDS
            </div>

            <div
                class="my-card-row"
                id="myCards">
            </div>

        </div>

    </div>

    <div class="controls">

        <div
            class="turn-info"
            id="turnInfo">
            Waiting for game...
        </div>

        <div class="buttons">

            <button
                class="fold"
                onclick="sendAction('fold')">
                FOLD
            </button>

            <button
                class="check"
                onclick="sendAction('check')">
                CHECK
            </button>

            <button
                class="call"
                onclick="sendAction('call')">
                CALL
            </button>

            <button
                class="raise"
                onclick="openRaise()">
                RAISE
            </button>

            <button
                class="allin"
                onclick="sendAction('allin')">
                ALL-IN
            </button>

        </div>

        <div class="secondary">

            <button onclick="startGame()">
                ▶ START GAME
            </button>

            <button onclick="nextCard()">
                NEXT STREET
            </button>

        </div>

    </div>

</div>


<!-- RAISE -->

<div
    class="raise-box"
    id="raiseBox">

    <div class="raise-title">
        RAISE TO
    </div>

    <input
        id="raiseAmount"
        class="raise-input"
        type="number"
        min="20"
        placeholder="Enter amount">

    <div class="raise-actions">

        <button
            class="raise"
            onclick="confirmRaise()">
            RAISE
        </button>

        <button
            onclick="closeRaise()">
            CANCEL
        </button>

    </div>

</div>


<div
    class="message"
    id="message">
</div>


<script>

/* =========================
   TELEGRAM
========================= */

const tg = window.Telegram?.WebApp;

if (tg) {
    tg.ready();
    tg.expand();
}


/* =========================
   API
========================= */

const API =
    "https://telegram-poker-pro-backend.onrender.com";


/* =========================
   USER
========================= */

let myUserId = null;
let myName = "Player";

function getTelegramUser() {

    if (
        tg &&
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user
    ) {

        const user =
            tg.initDataUnsafe.user;

        myUserId =
            String(user.id);

        myName =
            user.first_name ||
            user.username ||
            "Player";

    } else {

        let saved =
            localStorage.getItem(
                "poker_user_id"
            );

        if (!saved) {

            saved =
                "web_" +
                Math.random()
                    .toString(36)
                    .substring(2, 10);

            localStorage.setItem(
                "poker_user_id",
                saved
            );
        }

        myUserId = saved;

        myName =
            localStorage.getItem(
                "poker_user_name"
            ) ||
            "Player";
    }
}


/* =========================
   CONNECTION
========================= */

function setConnection(
    text,
    good = true
) {

    const el =
        document.getElementById(
            "connection"
        );

    el.innerText = text;

    el.style.color =
        good
            ? "#7dff9b"
            : "#ff7070";
}


/* =========================
   JOIN
========================= */

async function joinGame() {

    try {

        getTelegramUser();

        const response =
            await fetch(
                API + "/join",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        user_id: myUserId,
                        name: myName
                    })
                }
            );

        const data =
            await response.json();

        if (!data.success) {

            setConnection(
                data.message ||
                "Join failed",
                false
            );

            return;
        }

        setConnection(
            "● Connected",
            true
        );

        await loadGame();
        await loadMyCards();

    } catch (error) {

        console.error(error);

        setConnection(
            "Connection failed",
            false
        );
    }
}


/* =========================
   LOAD GAME
========================= */

async function loadGame() {

    try {

        const response =
            await fetch(
                API + "/game"
            );

        const data =
            await response.json();

        renderGame(data);

    } catch (error) {

        console.error(error);

        setConnection(
            "Reconnecting...",
            false
        );
    }
}


/* =========================
   LOAD CARDS
========================= */

async function loadMyCards() {

    try {

        const response =
            await fetch(
                API +
                "/my-cards?user_id=" +
                encodeURIComponent(
                    myUserId
                )
            );

        const data =
            await response.json();

        if (data.success) {

            renderMyCards(
                data.cards || []
            );
        }

    } catch (error) {

        console.error(error);
    }
}


/* =========================
   RENDER GAME
========================= */

function renderGame(data) {

    if (!data) return;

    document.getElementById(
        "stage"
    ).innerText =
        (data.stage || "waiting")
            .toUpperCase();

    document.getElementById(
        "pot"
    ).innerText =
        Number(
            data.pot || 0
        ).toLocaleString();


    renderCommunity(
        data.community_cards || []
    );


    renderPlayers(
        data.players || [],
        data.current_player,
        data.turn_time || 0
    );


    const turnInfo =
        document.getElementById(
            "turnInfo"
        );

    const current =
        (data.players || [])
            .find(
                p =>
                    p.user_id ===
                    data.current_player
            );


    if (!data.started) {

        if (data.winner) {

            turnInfo.innerText =
                "🏆 " +
                data.winner;

        } else {

            turnInfo.innerText =
                "Waiting for game...";
        }

        return;
    }


    if (current) {

        if (
            current.user_id ===
            myUserId
        ) {

            turnInfo.innerText =
                "🔥 YOUR TURN";

        } else {

            turnInfo.innerText =
                "🎯 " +
                current.name +
                "'s turn";
        }

    } else {

        turnInfo.innerText =
            "Waiting...";
    }
}


/* =========================
   COMMUNITY
========================= */

function renderCommunity(cards) {

    const box =
        document.getElementById(
            "community"
        );

    box.innerHTML = "";

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const card =
            document.createElement(
                "div"
            );

        if (cards[i]) {

            card.className =
                "card";

            if (
                cards[i].includes("♥") ||
                cards[i].includes("♦")
            ) {

                card.classList.add(
                    "red"
                );
            }

            card.innerText =
                cards[i];

        } else {

            card.className =
                "card empty";
        }

        box.appendChild(card);
    }
}


/* =========================
   PLAYERS
========================= */

function renderPlayers(
    list,
    currentPlayer,
    time
) {

    for (
        let i = 0;
        i < 6;
        i++
    ) {

        const seat =
            document.getElementById(
                "seat" + i
            );

        const p = list[i];


        seat.classList.remove(
            "active",
            "warning",
            "danger"
        );


        const avatar =
            seat.querySelector(
                ".seat-avatar"
            );

        const name =
            seat.querySelector(
                ".seat-name"
            );

        const chips =
            seat.querySelector(
                ".seat-chips"
            );

        const bet =
            seat.querySelector(
                ".seat-bet"
            );


        seat.querySelectorAll(
            ".timer,.dealer"
        ).forEach(
            el => el.remove()
        );


        if (!p) {

            avatar.innerText = "♠";
            name.innerText = "Empty";
            chips.innerText = "-";
            bet.innerText = "";

            continue;
        }


        avatar.innerText =
            p.is_bot
                ? "🤖"
                : "👤";


        name.innerText =
            p.name || "Player";


        chips.innerText =
            "🪙 " +
            Number(
                p.chips || 0
            ).toLocaleString();


        if (p.folded) {

            bet.innerText =
                "FOLDED";

            seat.style.opacity =
                ".45";

        } else {

            seat.style.opacity =
                "1";

            bet.innerText =
                p.bet > 0
                    ? "BET " +
                      p.bet
                    : "";
        }


        if (p.is_dealer) {

            const dealer =
                document.createElement(
                    "div"
                );

            dealer.className =
                "dealer";

            dealer.innerText =
                "D";

            seat.appendChild(
                dealer
            );
        }


        if (
            p.user_id ===
            currentPlayer
        ) {

            seat.classList.add(
                "active"
            );


            const timer =
                document.createElement(
                    "div"
                );

            timer.className =
                "timer";

            const timerText =
                document.createElement(
                    "div"
                );

            timerText.className =
                "timer-text";

            timerText.innerText =
                Math.max(
                    0,
                    time
                );

            timer.appendChild(
                timerText
            );

            seat.appendChild(
                timer
            );


            updateTimer(
                seat,
                timer,
                timerText,
                time
            );
        }
    }
}


/* =========================
   TIMER
========================= */

function updateTimer(
    seat,
    timer,
    text,
    seconds
) {

    const total = 30;

    let remaining =
        Math.max(
            0,
            Number(seconds)
        );

    function tick() {

        text.innerText =
            remaining;

        const percent =
            Math.max(
                0,
                Math.min(
                    100,
                    (remaining /
                        total) *
                        100
                )
            );

        timer.style
            .setProperty(
                "--progress",
                percent + "%"
            );


        seat.classList.remove(
            "warning",
            "danger"
        );


        if (remaining <= 10) {

            seat.classList.add(
                "warning"
            );
        }


        if (remaining <= 5) {

            seat.classList.remove(
                "warning"
            );

            seat.classList.add(
                "danger"
            );
        }


        if (remaining > 0) {

            remaining--;

            setTimeout(
                tick,
                1000
            );
        }
    }

    tick();
}


/* =========================
   MY CARDS
========================= */

function renderMyCards(cards) {

    const box =
        document.getElementById(
            "myCards"
        );

    box.innerHTML = "";

    cards.forEach(cardValue => {

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "my-card";

        if (
            cardValue.includes("♥") ||
            cardValue.includes("♦")
        ) {

            card.style.color =
                "#d92727";
        }

        card.innerText =
            cardValue;

        box.appendChild(card);
    });
}


/* =========================
   ACTION
========================= */

async function sendAction(
    action,
    amount = 0
) {

    try {

        const response =
            await fetch(
                API + "/action",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        user_id:
                            myUserId,

                        action:
                            action,

                        amount:
                            Number(amount || 0)
                    })
                }
            );

        const data =
            await response.json();


        if (!data.success) {

            showMessage(
                data.message ||
                "Action failed"
            );

            return;
        }


        renderGame(
            data.game
        );

        await loadMyCards();

    } catch (error) {

        console.error(error);

        showMessage(
            "Connection error"
        );
    }
}


/* =========================
   START GAME
========================= */

async function startGame() {

    try {

        const response =
            await fetch(
                API + "/start",
                {
                    method: "POST"
                }
            );

        const data =
            await response.json();


        if (!data.success) {

            showMessage(
                data.message ||
                "Could not start game"
            );

            return;
        }


        renderGame(
            data.game
        );

        await loadMyCards();

    } catch (error) {

        console.error(error);

        showMessage(
            "Could not connect"
        );
    }
}


/* =========================
   NEXT STREET
========================= */

async function nextCard() {

    try {

        const response =
            await fetch(
                API + "/next-card",
                {
                    method: "POST"
                }
            );

        const data =
            await response.json();


        if (!data.success) {

            showMessage(
                data.message ||
                "Cannot advance"
            );

            return;
        }


        renderGame(data);

        await loadMyCards();

    } catch (error) {

        console.error(error);

        showMessage(
            "Connection error"
        );
    }
}


/* =========================
   RAISE
========================= */

function openRaise() {

    document
        .getElementById(
            "raiseBox"
        )
        .classList.add(
            "show"
        );

    document
        .getElementById(
            "raiseAmount"
        )
        .focus();
}


function closeRaise() {

    document
        .getElementById(
            "raiseBox"
        )
        .classList.remove(
            "show"
        );
}


async function confirmRaise() {

    const amount =
        Number(
            document.getElementById(
                "raiseAmount"
            ).value
        );


    if (!amount || amount <= 0) {

        showMessage(
            "Enter a valid amount"
        );

        return;
    }


    closeRaise();

    await sendAction(
        "raise",
        amount
    );
}


/* =========================
   MESSAGE
========================= */

function showMessage(
    text
) {

    const box =
        document.getElementById(
            "message"
        );

    box.innerText =
        text;

    box.classList.add(
        "show"
    );


    setTimeout(() => {

        box.classList.remove(
            "show"
        );

    }, 2200);
}


/* =========================
   AUTO REFRESH
========================= */

setInterval(
    async () => {

        await loadGame();

        await loadMyCards();

    },
    1000
);


/* =========================
   START
========================= */

joinGame();
